name: Test Barn Basketball
on:
  push:
    branches: [main, feature/contacts-and-no-shows, fix/invite-send-confirmation, feature/batch-invites-calendar-reminders, fix/one-tap-sms, design/navy-court-dashboard, fix/basketball-logo-hoop-v2, release/live-cleanup-response-status, fix/reset-invite-shortcut, fix/fixed-bottom-tabbar-ios, fix/dashboard-show-all-invited, fix/dashboard-full-roster-sorted, fix/ios-bottom-nav-scroll-container, fix/viewport-shell-tabs, fix/standalone-bottom-gap, fix/standalone-edge-anchor, fix/layout-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run app smoke tests
        run: npm test
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise mobile viewport and resume flows
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layouts
          path: /tmp/barn-*.png
