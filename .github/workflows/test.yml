name: Test Barn Basketball
on:
  push:
    branches: [main, feature/contacts-and-no-shows, fix/invite-send-confirmation, feature/batch-invites-calendar-reminders, fix/one-tap-sms]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run app smoke tests
        run: node tests/smoke.cjs
