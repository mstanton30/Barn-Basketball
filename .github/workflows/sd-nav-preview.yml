name: SD navigation preview checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/sd-nav-preview.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
